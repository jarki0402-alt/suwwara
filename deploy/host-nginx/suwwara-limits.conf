# /etc/nginx/conf.d/suwwara-limits.conf
#
# What Cloudflare used to absorb, now at the VM's own door. Counted per visitor IP (the real one: see
# cloudflare-realip.conf), in a few MB of shared memory, nothing that competes with the app for RAM.
#
# - General: 30 requests/s per IP with a burst of 100. Opening the app fetches a few dozen files at once, and an iPhone
#   makes ~14 range requests per song; a person never comes near this, a script hammering the site does.
# - Sign-in: 10 a minute per IP (burst 5), on top of the app's own lockout. Replaces the Cloudflare WAF rule.
# - Connections: 40 open at once per IP: Jam and Connect each keep one stream per device, and a family behind one
#   home router shares an IP.
limit_req_zone $binary_remote_addr zone=suwwara_req:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=suwwara_login:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=suwwara_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# A visitor that sends its request headers a byte at a time ("slowloris") is dropped after 10 s instead of holding a slot.
client_header_timeout 10s;

# Anything that asks for the bare IP or an unknown name gets the connection closed, not the nginx welcome page: scanners
# learn nothing. (Replaces the stock "default" site, which must be removed: see DEPLOY.md.)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
