# /etc/nginx/snippets/suwwara-proxy.conf
# Hand-off to the app's own nginx (Docker, 127.0.0.1:8080). Streams as it goes (audio, video, the Jam/Connect event
# streams): nothing is buffered on this VM.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The app reads the visitor's IP from this header. $remote_addr is already the real visitor (cloudflare-realip.conf), and
# setting it here overwrites whatever the visitor sent: a forged value never reaches the app.
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header Connection "";
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
