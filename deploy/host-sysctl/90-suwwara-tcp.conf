# /etc/sysctl.d/90-suwwara-tcp.conf (on the VM)
#
# TCP for a long path: the VM is in Oregon, the listeners in Indonesia (~200-300 ms round trip). BBR paces by the path's
# measured capacity instead of halving its speed at every lost packet, and keeping the window across idle gaps stops
# each audio chunk from starting slow again. No memory cost; applies to new connections at once, no restart.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_slow_start_after_idle = 0

# REQUIRED, keep it in this file: Google's image ships /etc/sysctl.d/60-gce-network-security.conf with
# net.ipv4.ip_forward=0. Docker turns forwarding on when it starts, but any `sysctl --system` (installing this very
# file, a package upgrade) applies Google's 0 again and every container loses the internet: yt-dlp can't look up
# youtube.com ("[Errno -3] Try again") and no new song resolves (happened 2026-11-11 10:29 UTC). This file sorts after
# 60-, so its 1 wins. The VM's own firewall/GCP rules still decide what may reach it; this only lets Docker route.
net.ipv4.ip_forward = 1
