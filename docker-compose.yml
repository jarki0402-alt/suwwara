services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=suwwara
      - POSTGRES_USER=suwwara
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - suwwara-postgres-data:/var/lib/postgresql/data
    # No `ports:` on purpose — only reachable from other containers on this
    # compose network (i.e. only `backend`), never exposed to the host or the
    # public internet. See the Suwwara architecture blueprint for why this
    # matters: Vercel never touches this database at all.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suwwara -d suwwara"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=8787
      # Passed as discrete fields (not one postgres://user:pass@host URL) on purpose —
      # a password containing URL-reserved characters (#, %, @, etc.) silently breaks
      # URL parsing (this bit us with a real password once, see the git history for
      # this line). postgres npm package accepts an options object instead, so
      # server/src/db/client.ts builds the connection from these directly, no
      # URL-encoding needed regardless of what's in the password.
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=suwwara
      - PGUSER=suwwara
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # YouTube session cookies (Netscape format), gitignored — required for yt-dlp to
      # get past "Sign in to confirm you're not a bot" once an IP gets flagged. Create
      # this file (even an empty placeholder) BEFORE first `docker compose up`, or
      # Docker will bind-mount an empty directory here instead of a file. See
      # server/src/youtube/stream.ts and the yt-dlp wiki on exporting cookies.
      # Read-WRITE (not :ro) on purpose — yt-dlp writes refreshed session cookies back
      # to this file after use, which is what makes them last longer before expiring.
      - ./cookies.txt:/app/cookies.txt
    ports:
      # Published to the host (not just the internal Docker network) on purpose: this
      # lets audio streaming be pointed at directly, bypassing a Cloudflare-proxied
      # hostname entirely if you want to keep heavy audio traffic off Cloudflare's edge
      # (see the frontend's /api/ proxy in nginx.conf for the alternative — routing
      # everything, audio included, through one origin).
      - "8787:8787"

  frontend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  suwwara-postgres-data:
