# Container logs are unbounded by default (json-file, no rotation). On this VM's small
# disk a chatty service — the backend logs every yt-dlp resolve — would eventually fill
# it. 3 x 10MB per service is plenty to debug from and can never grow past that.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=suwwara
      - POSTGRES_USER=suwwara
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - suwwara-postgres-data:/var/lib/postgresql/data
    # No `ports:` on purpose — only reachable from other containers on this
    # compose network (i.e. only `backend`), never exposed to the host or the
    # public internet. See the Suwwara architecture blueprint for why this
    # matters: Vercel never touches this database at all.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suwwara -d suwwara"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    logging: *default-logging
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=8787
      # Passed as discrete fields (not one postgres://user:pass@host URL) on purpose —
      # a password containing URL-reserved characters (#, %, @, etc.) silently breaks
      # URL parsing (this bit us with a real password once, see the git history for
      # this line). postgres npm package accepts an options object instead, so
      # server/src/db/client.ts builds the connection from these directly, no
      # URL-encoding needed regardless of what's in the password.
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=suwwara
      - PGUSER=suwwara
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Sign-in is required for everything; the first boot creates this admin (see server/src/auth/users.ts).
      # Leave ADMIN_PASSWORD empty to have one generated and printed once in `docker compose logs backend`.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Admin dashboard's "Kuota bulan ini" display — a reference point, not an enforced limit. See .env.example.
      - BANDWIDTH_QUOTA_GB=${BANDWIDTH_QUOTA_GB:-200}
      # YouTube's DNS answers include IPv6 addresses this VM's Docker network cannot route; a client that tries one first
      # waits out the whole connect timeout before falling back (searches hung ~60s, chunk fetches failed).
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Whole tracks kept on disk (see server/src/youtube/diskCache.ts); the volume outlives container recreation.
      - AUDIO_CACHE_MAX_MB=${AUDIO_CACHE_MAX_MB:-6144}
    volumes:
      - suwwara-audio-cache:/data/audio-cache
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1

    ports:
      # Loopback only. It used to be open to the whole network so audio could bypass Cloudflare, but sign-in is now a
      # cookie on the site's own domain, which a request straight to http://<vm-ip>:8787 could never carry — and an open
      # port would let anyone forge the CF-Connecting-IP header the login rate limit trusts. From the VM itself
      # (curl, debugging) http://localhost:8787 still works.
      - "127.0.0.1:8787:8787"

  ytdlp-service:
    logging: *default-logging
    build:
      context: ./server/ytdlp-service
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1

  bgutil-provider:
    logging: *default-logging
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    # By default, the provider runs on port 4416 inside the container.
    # No need to publish ports to the host; the backend accesses it internally.

  frontend:
    logging: *default-logging
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  suwwara-postgres-data:
  suwwara-audio-cache:
