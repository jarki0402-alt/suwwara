server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Search/metadata responses (JSON) were being sent uncompressed — barely
    # noticeable on fast laptop WiFi, but a real chunk of time on slower mobile
    # connections. Audio (audio/*) is deliberately excluded: it's already
    # compressed at the codec level, so gzipping it would just burn CPU for
    # zero size benefit on this 1-vCPU e2-micro.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/json text/plain text/css application/javascript;
    # Search/metadata responses arrive via proxy_pass (below) — nginx doesn't
    # compress proxied responses by default regardless of gzip_types, unless
    # explicitly told to with gzip_proxied.
    gzip_proxied any;

    # Vite content-hashes filenames under /assets/, so these are safe to cache forever —
    # a changed file gets a new filename, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The files that decide whether a device even LEARNS a new version exists must never be served from a cache. Without
    # a Cache-Control header, browsers cache index.html/manifest by a heuristic (a fraction of their age), and a CDN or
    # tunnel in front (Cloudflare caches .js by extension, for hours) keeps handing out the OLD sw.js — so the installed
    # app never sees the new build and "Cek pembaruan" answers "sudah terbaru". no-store is honoured by Cloudflare too.
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The build stamp the update check compares against (see src/pwa/registerSW.ts).
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # search/browse/details/similar/trending were briefly split off to Vercel (the
    # vercel/ project is kept, not deleted, in case this gets revisited) but reverted:
    # on this app's actual (low/bursty) traffic, Vercel serverless cold starts — which
    # re-pay ytmusic-api's initialize() handshake from scratch on every cold instance —
    # cost more than the always-on GCP process ever did, since that singleton only
    # initializes once and then stays warm for the container's whole lifetime. All
    # /api/* traffic is back on the local backend container below.
    # Resolve Docker's embedded DNS dynamically so Nginx doesn't cache the old IP
    # if the backend container is recreated (which previously caused 502 Bad Gateway).
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:8787";

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Audio streaming relies on Range requests (see server/src/routes/audio.ts) —
        # buffering here would break seeking and delay the first audible byte.
        proxy_buffering off;
    }

    # No client-side router (navigation is in-memory app state — see src/sw.ts) but this
    # keeps any direct/deep-linked request safely falling back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
