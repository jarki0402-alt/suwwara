server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes filenames under /assets/, so these are safe to cache forever —
    # a changed file gets a new filename, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxies to the backend container over the internal Docker network — matches the
    # same-origin relative /api/* calls the frontend already makes in src/api/musicClient.ts
    # (identical in spirit to Vite's dev-time server.proxy config).
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Audio streaming relies on Range requests (see server/src/routes/audio.ts) —
        # buffering here would break seeking and delay the first audible byte.
        proxy_buffering off;
    }

    # No client-side router (navigation is in-memory app state — see src/sw.ts) but this
    # keeps any direct/deep-linked request safely falling back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
