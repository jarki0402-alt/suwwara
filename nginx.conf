server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes filenames under /assets/, so these are safe to cache forever —
    # a changed file gets a new filename, never a stale cache hit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Stateless YouTube-metadata reads (search/browse/details/similar/trending) are
    # routed to Vercel instead of the local backend container — see the Suwwara
    # architecture blueprint. These never touch Postgres or yt-dlp, so splitting them
    # off means metadata requests stop competing with audio-resolve CPU on the GCP box,
    # and get Vercel's edge latency to Indonesia for free. REPLACE the placeholder host
    # below with your actual Vercel deployment domain (see deploy steps).
    location ~ ^/api/(search|browse|details|similar|trending) {
        proxy_pass https://suwwara.vercel.app;
        proxy_http_version 1.1;
        proxy_set_header Host suwwara.vercel.app;
        proxy_ssl_server_name on;
    }

    # Everything else (audio resolve/proxy, auth/pairing, library sync, Jam) stays on
    # the local backend container over the internal Docker network — matches the
    # same-origin relative /api/* calls the frontend already makes in src/api/musicClient.ts
    # (identical in spirit to Vite's dev-time server.proxy config).
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Audio streaming relies on Range requests (see server/src/routes/audio.ts) —
        # buffering here would break seeking and delay the first audible byte.
        proxy_buffering off;
    }

    # No client-side router (navigation is in-memory app state — see src/sw.ts) but this
    # keeps any direct/deep-linked request safely falling back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
